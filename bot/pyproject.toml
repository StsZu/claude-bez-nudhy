[project]
name = "bez-nudhy-bot"
version = "0.1.0"
description = "Telegram-бот нагадувань курсу «Claude без нудьги»"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.31,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bez-nudhy-bot = "bez_nudhy_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bez_nudhy_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
